<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="stylesheet" href="./css/estilo.css" />
        <title>formulaal</title>
    </head>

    <body>
        <div class="container">
            <h2>Formulário completo</h2>
            <form action="" method="post">
                <div class="form-group-1">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" />
                </div>
                <div class="form-group-1">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemplo@email.com"
                    />
                </div>
                <div class="form-group-3">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" />
                </div>
                <div class="form-group-3">
                    <label for="numero">Número</label>
                    <input type="number" id="numero" name="numero" />
                </div>
                <div class="form-group-3">
                    <label for="telefone">Telefone</label>
                    <input
                        id="telefone"
                        name="telefone"
                        type="tel"
                        pattern="^\(\d{2}\)\s\d{4,5}-\d{4}$"
                        maxlength="15"
                        placeholder="(00) 00000-0000"
                        oninput="
                            this.value = this.value
                                .replace(/\D/g, '')
                                .replace(/^(\d{2})(\d)/g, '($1) $2')
                                .replace(/(\d)(\d{4})$/, '$1-$2')
                        "
                        required
                    />
                </div>

                <div class="form-group-1">
                    <label for="url">URL</label>
                    <input type="url" id="url" name="url" />
                </div>

                <div class="form-group-2">
                    <label for="data">Data</label>
                    <input type="date" id="data" name="data" />
                </div>
                <div class="form-group-2">
                    <label for="hora">Hora</label>
                    <input type="time" id="hora" name="hora" />
                </div>
                <div class="form-group-2">
                    <label for="cor">Cor favorita</label>
                    <input type="color" id="cor" name="cor" />
                </div>
                <div class="form-group-2">
                    <label for="satisfacao">Nível de satisfação</label>
                    <input type="range" id="satisfacao" name="satisfacao" />
                </div>
                <div class="form-group-2">
                    <label for="arquivo">Arquivo</label>
                    <input type="file" id="arquivo" name="arquivo" />
                </div>
                <div class="form-group-2">
                    <label for="">Gênero</label>
                    <div class="radio-group">
                        <label>
                            <input
                                type="radio"
                                id="masc"
                                name="genero"
                                value="m"
                            />Masculino</label
                        >

                        <label>
                            <input
                                type="radio"
                                id="fem"
                                name="genero"
                                value="f"
                            />Feminino</label
                        >
                    </div>
                </div>

                <div class="form-group-1">
                    <label for="">Interesses</label>
                    <div class="checkbox-group">
                        <label>
                            <input
                                type="checkbox"
                                id="tecnologia"
                                name="tecnologia"
                                value="tecnologia"
                            />Tecnologia</label
                        >
                        <label>
                            <input
                                type="checkbox"
                                id="esporte"
                                name="esporte"
                                value="esporte"
                            />Esporte</label
                        >
                        <label>
                            <input
                                type="checkbox"
                                id="musica"
                                name="musica"
                                value="musica"
                            />Música</label
                        >
                    </div>
                </div>

                <div class="form-group-1">
                    <label>Selecione uma opção</label>
                    <select name="area" id="area">
                        <option value="programacao">Programação</option>
                        <option value="eng-sw">Engenharia de software</option>
                        <option value="gestao-prj">Gestão de projeto</option>
                    </select>
                </div>

                <div class="form-group-1">
                    <label>Envie-nos uma mensagem</label>
                    <textarea name="msg" id="msg"></textarea>
                </div>

                <input class="enviar" type="submit" value="Enviar" />
            </form>
        </div>
    </body>
</html>
